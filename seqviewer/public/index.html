<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S4 Sequences — visor de .seq</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151a22; --line: #232b36;
    --fg: #e6edf3; --dim: #8b97a6; --accent: #4ea3ff; --warn: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
    display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; height: 100vh;
    overflow: hidden;
  }
  .panel { background: var(--panel); overflow: auto; }
  #list { border-right: 1px solid var(--line); }
  #side { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 0; padding: 10px 12px; position: sticky; top: 0;
       background: var(--panel); border-bottom: 1px solid var(--line); z-index: 2; }
  #search { width: 100%; padding: 7px 12px; background: #0b0e13; color: var(--fg);
            border: 0; border-bottom: 1px solid var(--line); font: inherit; }
  #tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tab { flex: 1; border: 0; border-radius: 0; background: #11161d; color: var(--dim);
         padding: 7px 4px; cursor: pointer; }
  .tab.sel { background: #16324f; color: #fff; }
  select { background: #202836; color: var(--fg); border: 1px solid var(--line);
           border-radius: 4px; padding: 4px; font: inherit; max-width: 190px; }
  #sideTabs { display: flex; position: sticky; top: 0; z-index: 2;
              border-bottom: 1px solid var(--line); }
  .stab { flex: 1; border: 0; border-radius: 0; background: #11161d; color: var(--dim);
          padding: 8px 4px; cursor: pointer; }
  .stab.sel { background: #16324f; color: #fff; }
  .slotbox { border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .slotbox h3 { margin: 0 0 6px; font-size: 11px; color: var(--accent);
                text-transform: uppercase; letter-spacing: .06em; }
  .slotbox select { width: 100%; max-width: none; }
  #editor { font-size: 12px; }
  #editor .edGlobal { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #editor details { border-bottom: 1px solid var(--line); }
  #editor summary { padding: 6px 12px; cursor: pointer; color: var(--accent); user-select: none; }
  #editor summary:hover { background: rgba(255,255,255,.04); }
  #editor .edBody { padding: 4px 12px 10px; }
  #editor .edRow { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 0; }
  #editor .edRow span { color: #cfd6df; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #editor .edRow input { width: 96px; background: #0e1116; color: #e8edf3; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
  #editor .edSave { position: sticky; bottom: 0; padding: 6px 12px; background: var(--bg); border-top: 1px solid var(--line); color: #9aa4b2; }
  .item { padding: 5px 12px; cursor: pointer; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .item:hover { background: #1c232d; }
  .item.sel { background: #16324f; color: #fff; }
  .item small { color: var(--dim); }
  #center { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  #canvasWrap { flex: 1; position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; top: 10px; left: 12px; color: var(--dim);
         text-shadow: 0 1px 3px #000; pointer-events: none; }
  #hud b { color: var(--fg); }
  #animhud { position: absolute; top: 10px; right: 12px; color: var(--accent); font-size: 12px;
             background: rgba(0,0,0,.55); padding: 4px 9px; border-radius: 6px; display: none; }
  #diag { position: absolute; bottom: 10px; left: 12px; right: 12px; color: var(--dim);
          font-size: 11px; text-shadow: 0 1px 3px #000; pointer-events: none; }
  #diag b { color: var(--warn); }
  .ctl { color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .ctl input { width: 90px; }
  #transport { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 12px;
               border-top: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
  #transport > * { flex-shrink: 0; }
  button { background: #202836; color: var(--fg); border: 1px solid var(--line);
           border-radius: 4px; padding: 5px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #scrub { flex: 1 1 160px; min-width: 120px; }
  #time { color: var(--dim); min-width: 120px; text-align: right; }
  .node { border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .node .cls { color: var(--accent); }
  .node .nm { color: var(--warn); }
  .kv { color: var(--dim); }
  .kv b { color: var(--fg); font-weight: normal; }
  .asset { color: #9be29b; word-break: break-all; font-size: 11px; }
  .asset .swap { color: var(--dim); }
  .missing { color: #ff7b72; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  td { padding: 1px 4px; border-bottom: 1px solid #1b222c; }
  td.off { color: var(--dim); width: 44px; }
  td.f { text-align: right; }
  .hl { color: var(--warn); }
  #err { padding: 12px; color: #ff7b72; white-space: pre-wrap; }
</style>
</head>
<body>
  <div id="list" class="panel">
    <h2>Recursos (<span id="count">…</span>)</h2>
    <div id="tabs">
      <button class="tab sel" data-k="seq">Secuencias</button>
      <button class="tab" data-k="scn">Escenas</button>
    </div>
    <input id="search" placeholder="filtrar…" autocomplete="off">
    <div id="items"></div>
  </div>

  <div id="center">
    <div id="canvasWrap">
      <div id="hud"></div>
      <div id="animhud"></div>
      <div id="diag"></div>
    </div>
    <div id="transport">
      <button id="play">▶ Reproducir</button>
      <button id="reset">⟲</button>
      <input id="scrub" type="range" min="0" max="1000" value="0">
      <span id="time">—</span>
      <label class="ctl">tamaño ×<span id="boostV">1</span>
        <input id="boost" type="range" min="0" max="60" value="0"></label>
      <button id="fit">Encajar</button>
      <label class="ctl" title="Si se activa, la camara se recoloca al cambiar de secuencia">
        <input id="autofit" type="checkbox"> auto</label>
      <label class="ctl">personaje
        <select id="chara">
          <option value="">ninguno</option>
          <option value="male">masculino</option>
          <option value="female">femenino</option>
          <option value="bip_male">esqueleto M</option>
          <option value="bip_female">esqueleto F</option>
        </select></label>
      <label class="ctl">anim <select id="clip"><option value="">—</option></select></label>
      <label class="ctl">arma <select id="weapon"><option value="">ninguna</option></select></label>
      <label class="ctl">a <select id="anchor">
        <option>R_Hand_Dummy</option><option>L_Hand_Dummy</option>
        <option>Gun_Dummy</option><option>Bip01 R Hand</option><option>Bip01 L Hand</option>
        <option>Spine_Dummy</option><option>Card_Dummy</option>
      </select></label>
    </div>
  </div>

  <div id="side" class="panel">
    <div id="sideTabs">
      <button class="stab sel" data-k="info">Nodos</button>
      <button class="stab" data-k="equip">Equipar</button>
      <button class="stab" data-k="edit">Editor</button>
    </div>
    <div id="info"></div>
    <div id="equip" hidden></div>
    <div id="editor" hidden></div>
    <div id="err"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
